name: daily-ai-repo-tracker

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 07:00 Oman time (GST, UTC+4)
  workflow_dispatch:       # allows manual runs from the Actions tab
    inputs:
      rescore_days:
        description: "One-off: re-score repos first seen in the last N days (0 = normal run)"
        default: "0"
      reset_venture:
        description: "One-off: venture name whose old tags should be cleared"
        default: ""

permissions:
  contents: write

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FILTER_MODEL: ${{ vars.FILTER_MODEL }}
          SCORE_MODEL: ${{ vars.SCORE_MODEL }}
          RESCORE_DAYS: ${{ inputs.rescore_days }}
          RESET_VENTURE: ${{ inputs.reset_venture }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tracker.py

      - name: Commit updated archive
        run: |
          git config user.name "ai-repo-tracker[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u +%F)"
          git push
