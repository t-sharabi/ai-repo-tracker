<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Repo Tracker</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#262b38; --text:#e8eaf0;
          --dim:#9aa1b2; --accent:#5eead4; --rise:#fbbf24; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding:32px 16px; max-width:1080px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  #meta { color:var(--dim); font-size:13px; margin-bottom:20px; }
  #controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; }
  input, select { background:var(--card); color:var(--text);
         border:1px solid var(--line); border-radius:8px; padding:9px 12px;
         font-size:14px; }
  input { flex:1; min-width:220px; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--dim);
         font-size:14px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
         gap:14px; }
  .card { background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:16px; display:flex;
         flex-direction:column; gap:8px; }
  .card a.name { color:var(--accent); font-weight:600; text-decoration:none;
         word-break:break-all; }
  .card a.name:hover { text-decoration:underline; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         font-size:12.5px; color:var(--dim); }
  .badge { border:1px solid var(--line); border-radius:99px; padding:1px 9px; }
  .badge.rise { color:var(--rise); border-color:var(--rise); }
  .badge.opp { color:#f472b6; border-color:#f472b6; }
  .oppbox { font-size:13px; background:rgba(244,114,182,.08);
         border:1px solid rgba(244,114,182,.35); border-radius:8px;
         padding:8px 10px; }
  .sum { font-size:14px; }
  .desc { font-size:13px; color:var(--dim); }
  #empty { color:var(--dim); padding:40px 0; text-align:center; display:none; }
</style>
</head>
<body>
<h1>&#129302; AI Repo Tracker</h1>
<div id="meta">Loading&hellip;</div>
<div id="controls">
  <input id="q" type="search" placeholder="Search name, summary, description, topics&hellip;">
  <select id="cat"><option value="">All categories</option></select>
  <select id="venture"><option value="">All ventures</option></select>
  <select id="sort">
    <option value="date">Newest first</option>
    <option value="stars">Most stars</option>
    <option value="relevance">Most relevant to me</option>
  </select>
  <label class="chk"><input id="rising" type="checkbox"> Rising only</label>
  <label class="chk"><input id="opps" type="checkbox"> &#127919; Opportunities only</label>
</div>
<div id="grid"></div>
<div id="empty">No repos match.</div>
<script>
let DATA = [];
const $ = id => document.getElementById(id);

fetch('data.json').then(r => r.json()).then(j => {
  DATA = j.repos || [];
  $('meta').textContent = DATA.length + ' repos tracked \u00b7 last updated ' +
    (j.last_updated ? new Date(j.last_updated).toLocaleString() : 'never (first run pending)');
  const cats = [...new Set(DATA.map(r => r.category))].sort();
  for (const c of cats) {
    const o = document.createElement('option');
    o.value = o.textContent = c; $('cat').appendChild(o);
  }
  const vents = [...new Set(DATA.flatMap(r => r.ventures || []))].sort();
  for (const v of vents) {
    const o = document.createElement('option');
    o.value = o.textContent = v; $('venture').appendChild(o);
  }
  render();
}).catch(() => $('meta').textContent = 'Could not load data.json');

const OPP_MIN = 7;  // matches RELEVANCE_MIN_TO_FLAG in tracker.py

function render() {
  const q = $('q').value.toLowerCase(), cat = $('cat').value,
        rising = $('rising').checked, sort = $('sort').value,
        vent = $('venture').value, opps = $('opps').checked;
  let rows = DATA.filter(r =>
    (!cat || r.category === cat) && (!rising || r.rising) &&
    (!vent || (r.ventures || []).includes(vent)) &&
    (!opps || (r.relevance || 0) >= OPP_MIN) &&
    (!q || (r.full_name + ' ' + r.summary + ' ' + r.description + ' ' +
            (r.opportunity || '') + ' ' + (r.ventures || []).join(' ') + ' ' +
            (r.topics || []).join(' ')).toLowerCase().includes(q)));
  rows.sort(sort === 'stars' ? (a, b) => b.stars - a.stars
          : sort === 'relevance' ? (a, b) => (b.relevance || 0) - (a.relevance || 0) || b.stars - a.stars
          : (a, b) => b.first_seen.localeCompare(a.first_seen) || b.stars - a.stars);
  $('grid').innerHTML = rows.map(r => `
    <div class="card">
      <a class="name" href="${r.url}" target="_blank" rel="noopener">${esc(r.full_name)}</a>
      <div class="row">
        <span>\u2b50 ${r.stars}</span>
        ${r.language ? `<span>${esc(r.language)}</span>` : ''}
        <span class="badge">${esc(r.category || 'Other')}</span>
        ${r.rising ? '<span class="badge rise">&#128200; rising</span>' : ''}
        ${(r.relevance || 0) >= OPP_MIN ? `<span class="badge opp">&#127919; ${r.relevance}/10</span>` : ''}
        <span>${r.first_seen}</span>
      </div>
      <div class="sum">${esc(r.summary || '')}</div>
      ${(r.relevance || 0) >= OPP_MIN && r.opportunity ? `
      <div class="oppbox"><b>${esc((r.ventures || []).join(', ') || 'Opportunity')}</b> — ${esc(r.opportunity)}</div>` : ''}
      ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ''}
    </div>`).join('');
  $('empty').style.display = rows.length ? 'none' : 'block';
}

function esc(s) { return String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

for (const id of ['q', 'cat', 'sort', 'rising', 'venture', 'opps']) $(id).addEventListener('input', render);
</script>
</body>
</html>
