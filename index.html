<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Repo Tracker</title>
<style>
  :root { --bg:#0f1117; --card:#181b24; --line:#262b38; --text:#e8eaf0;
          --dim:#9aa1b2; --accent:#5eead4; --rise:#fbbf24; --fav:#fbbf24; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         padding:32px 16px; max-width:1080px; margin:0 auto; }
  h1 { font-size:22px; margin-bottom:4px; }
  #meta { color:var(--dim); font-size:13px; margin-bottom:20px; }
  #controls { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;
         align-items:center; }
  input, select { background:var(--card); color:var(--text);
         border:1px solid var(--line); border-radius:8px; padding:9px 12px;
         font-size:14px; }
  input#q { flex:1; min-width:220px; }
  label.chk { display:flex; align-items:center; gap:6px; color:var(--dim);
         font-size:14px; }
  button.iconbtn { background:var(--card); color:var(--dim);
         border:1px solid var(--line); border-radius:8px; padding:8px 11px;
         font-size:14px; cursor:pointer; }
  button.iconbtn:hover { color:var(--text); border-color:var(--dim); }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
         gap:14px; }
  .card { background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:16px; display:flex;
         flex-direction:column; gap:8px; }
  .cardtop { display:flex; gap:8px; align-items:flex-start; }
  .cardtop a.name { color:var(--accent); font-weight:600; text-decoration:none;
         word-break:break-all; flex:1; }
  .cardtop a.name:hover { text-decoration:underline; }
  .cardbtns { display:flex; gap:4px; }
  .cardbtns .iconbtn { padding:2px 8px; font-size:15px; border-radius:7px; }
  .cardbtns .favbtn.on { color:var(--fav); border-color:var(--fav); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         font-size:12.5px; color:var(--dim); }
  .badge { border:1px solid var(--line); border-radius:99px; padding:1px 9px; }
  .badge.rise { color:var(--rise); border-color:var(--rise); }
  .badge.opp { color:#f472b6; border-color:#f472b6; }
  .oppbox { font-size:13px; background:rgba(244,114,182,.08);
         border:1px solid rgba(244,114,182,.35); border-radius:8px;
         padding:8px 10px; }
  .sum { font-size:14px; }
  .desc { font-size:13px; color:var(--dim); }
  .panel { border:1px solid var(--line); border-radius:8px; padding:10px;
         background:var(--bg); display:flex; flex-direction:column; gap:8px;
         font-size:13.5px; }
  .panel[hidden] { display:none; }
  .panel .shr { display:flex; gap:6px; flex-wrap:wrap; }
  .panel .shr a, .panel .shr button { background:var(--card); color:var(--text);
         border:1px solid var(--line); border-radius:7px; padding:6px 10px;
         font-size:13px; text-decoration:none; cursor:pointer; }
  .panel .shr a:hover, .panel .shr button:hover { border-color:var(--dim); }
  .panel label { display:flex; gap:8px; align-items:center; color:var(--text);
         cursor:pointer; }
  .panel .newrow { display:flex; gap:6px; }
  .panel .newrow input { flex:1; padding:6px 9px; font-size:13px; }
  .panel .newrow button { white-space:nowrap; }
  .panel .hint { color:var(--dim); font-size:12px; }
  #empty { color:var(--dim); padding:40px 0; text-align:center; display:none; }
</style>
</head>
<body>
<h1>&#129302; AI Repo Tracker</h1>
<div id="meta">Loading&hellip;</div>
<div id="controls">
  <input id="q" type="search" placeholder="Search name, summary, description, topics&hellip;">
  <select id="cat"><option value="">All categories</option></select>
  <select id="venture"><option value="">All ventures</option></select>
  <select id="sort">
    <option value="date">Newest first</option>
    <option value="stars">Most stars</option>
    <option value="relevance">Most relevant to me</option>
  </select>
  <label class="chk"><input id="rising" type="checkbox"> Rising only</label>
  <label class="chk"><input id="opps" type="checkbox"> &#127919; Opportunities only</label>
  <select id="favview">
    <option value="">Everything</option>
    <option value="__all__">&#11088; All favorites</option>
  </select>
  <button id="newfolder" class="iconbtn" title="Create a favorites folder">&#65291; Folder</button>
  <button id="delfolder" class="iconbtn" title="Delete this folder" style="display:none">&#128465;</button>
</div>
<div id="grid"></div>
<div id="empty">No repos match.</div>
<script>
let DATA = [];
const $ = id => document.getElementById(id);
const OPP_MIN = 7;  // matches RELEVANCE_MIN_TO_FLAG in tracker.py
const FAV_KEY = 'airt_favs_v1';

// ------------------------- favorites (localStorage) -------------------------
function loadFav() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || {}; }
  catch { return {}; }
}
function saveFav() { localStorage.setItem(FAV_KEY, JSON.stringify(FAV)); }
let FAV = loadFav();   // { folderName: [full_name, ...] }

function favFolders() { return Object.keys(FAV).sort(); }
function isFav(name) { return favFolders().some(f => FAV[f].includes(name)); }
function refreshFavOptions() {
  const sel = $('favview'), cur = sel.value;
  sel.querySelectorAll('option[data-fld]').forEach(o => o.remove());
  for (const f of favFolders()) {
    const o = document.createElement('option');
    o.value = 'fld:' + f; o.textContent = '\u2B50 ' + f; o.dataset.fld = '1';
    sel.appendChild(o);
  }
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : '';
  $('delfolder').style.display = sel.value.startsWith('fld:') ? '' : 'none';
}

// --------------------------------- data ------------------------------------
fetch('data.json').then(r => r.json()).then(j => {
  DATA = j.repos || [];
  $('meta').textContent = DATA.length + ' repos tracked \u00b7 last updated ' +
    (j.last_updated ? new Date(j.last_updated).toLocaleString() : 'never (first run pending)');
  const cats = [...new Set(DATA.map(r => r.category))].sort();
  for (const c of cats) {
    const o = document.createElement('option');
    o.value = o.textContent = c; $('cat').appendChild(o);
  }
  const vents = [...new Set(DATA.flatMap(r => r.ventures || []))].sort();
  for (const v of vents) {
    const o = document.createElement('option');
    o.value = o.textContent = v; $('venture').appendChild(o);
  }
  refreshFavOptions();
  render();
}).catch(() => $('meta').textContent = 'Could not load data.json');

// -------------------------------- render -----------------------------------
function render() {
  const q = $('q').value.toLowerCase(), cat = $('cat').value,
        rising = $('rising').checked, sort = $('sort').value,
        vent = $('venture').value, opps = $('opps').checked,
        fv = $('favview').value;
  let rows = DATA.filter(r =>
    (!cat || r.category === cat) && (!rising || r.rising) &&
    (!vent || (r.ventures || []).includes(vent)) &&
    (!opps || (r.relevance || 0) >= OPP_MIN) &&
    (fv === '' || (fv === '__all__' ? isFav(r.full_name)
                 : (FAV[fv.slice(4)] || []).includes(r.full_name))) &&
    (!q || (r.full_name + ' ' + r.summary + ' ' + r.description + ' ' +
            (r.opportunity || '') + ' ' + (r.ventures || []).join(' ') + ' ' +
            (r.topics || []).join(' ')).toLowerCase().includes(q)));
  rows.sort(sort === 'stars' ? (a, b) => b.stars - a.stars
          : sort === 'relevance' ? (a, b) => (b.relevance || 0) - (a.relevance || 0) || b.stars - a.stars
          : (a, b) => b.first_seen.localeCompare(a.first_seen) || b.stars - a.stars);
  $('grid').innerHTML = rows.map(r => {
    const fav = isFav(r.full_name);
    return `
    <div class="card" data-name="${encodeURIComponent(r.full_name)}" data-url="${r.url}">
      <div class="cardtop">
        <a class="name" href="${r.url}" target="_blank" rel="noopener">${esc(r.full_name)}</a>
        <span class="cardbtns">
          <button class="iconbtn favbtn ${fav ? 'on' : ''}" title="Save to favorites">${fav ? '\u2605' : '\u2606'}</button>
          <button class="iconbtn sharebtn" title="Share">&#8599;</button>
        </span>
      </div>
      <div class="panel share" hidden></div>
      <div class="panel favp" hidden></div>
      <div class="row">
        <span>\u2b50 ${r.stars}</span>
        ${r.language ? `<span>${esc(r.language)}</span>` : ''}
        <span class="badge">${esc(r.category || 'Other')}</span>
        ${r.rising ? '<span class="badge rise">&#128200; rising</span>' : ''}
        ${(r.relevance || 0) >= OPP_MIN ? `<span class="badge opp">&#127919; ${r.relevance}/10</span>` : ''}
        <span>${r.first_seen}</span>
      </div>
      <div class="sum">${esc(r.summary || '')}</div>
      ${(r.relevance || 0) >= OPP_MIN && r.opportunity ? `
      <div class="oppbox"><b>${esc((r.ventures || []).join(', ') || 'Opportunity')}</b> — ${esc(r.opportunity)}</div>` : ''}
      ${r.description ? `<div class="desc">${esc(r.description)}</div>` : ''}
    </div>`;
  }).join('');
  $('empty').style.display = rows.length ? 'none' : 'block';
}

function esc(s) { return String(s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ------------------------- share & favorites panels ------------------------
function repoByName(name) { return DATA.find(r => r.full_name === name); }

function buildSharePanel(card) {
  const name = decodeURIComponent(card.dataset.name);
  const r = repoByName(name) || { url: card.dataset.url, summary: '' };
  const text = `${name} — ${r.summary || ''} ${r.url}`.trim();
  const eT = encodeURIComponent(text), eU = encodeURIComponent(r.url),
        eN = encodeURIComponent(name + (r.summary ? ' — ' + r.summary : ''));
  card.querySelector('.panel.share').innerHTML = `<div class="shr">
    <a href="https://wa.me/?text=${eT}" target="_blank" rel="noopener">WhatsApp</a>
    <a href="https://t.me/share/url?url=${eU}&text=${eN}" target="_blank" rel="noopener">Telegram</a>
    <a href="mailto:?subject=${encodeURIComponent(name)}&body=${eT}">Email</a>
    <button class="copybtn">Copy link</button>
  </div>`;
}

function buildFavPanel(card) {
  const name = decodeURIComponent(card.dataset.name);
  const folders = favFolders();
  const boxes = folders.map(f => `
    <label><input type="checkbox" class="favchk" data-folder="${esc(f)}"
      ${FAV[f].includes(name) ? 'checked' : ''}> ${esc(f)}
      <span class="hint">(${FAV[f].length})</span></label>`).join('');
  card.querySelector('.panel.favp').innerHTML =
    (folders.length ? boxes
     : '<div class="hint">No folders yet — create one per project below.</div>') +
    `<div class="newrow">
       <input type="text" class="newfld" placeholder="New folder (e.g. Open City)">
       <button class="iconbtn mkfld">Add</button>
     </div>`;
}

function toggle(card, which) {
  const p = card.querySelector('.panel.' + which),
        other = card.querySelector('.panel.' + (which === 'share' ? 'favp' : 'share'));
  other.hidden = true;
  if (p.hidden) { (which === 'share' ? buildSharePanel : buildFavPanel)(card); }
  p.hidden = !p.hidden;
}

$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  if (e.target.closest('.sharebtn')) return toggle(card, 'share');
  if (e.target.closest('.favbtn')) return toggle(card, 'favp');
  if (e.target.closest('.copybtn')) {
    const btn = e.target.closest('.copybtn');
    navigator.clipboard.writeText(card.dataset.url).then(() => {
      btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy link', 1500);
    }).catch(() => window.prompt('Copy this link:', card.dataset.url));
    return;
  }
  if (e.target.closest('.mkfld')) {
    const inp = card.querySelector('.newfld'),
          f = (inp.value || '').trim().slice(0, 40);
    if (!f) return inp.focus();
    if (!FAV[f]) FAV[f] = [];
    const name = decodeURIComponent(card.dataset.name);
    if (!FAV[f].includes(name)) FAV[f].push(name);
    saveFav(); refreshFavOptions(); buildFavPanel(card);
    syncStar(card, name);
  }
});

$('grid').addEventListener('change', e => {
  const chk = e.target.closest('.favchk');
  if (!chk) return;
  const card = e.target.closest('.card'),
        name = decodeURIComponent(card.dataset.name),
        f = chk.dataset.folder;
  if (chk.checked) { if (!FAV[f].includes(name)) FAV[f].push(name); }
  else { FAV[f] = FAV[f].filter(n => n !== name); }
  saveFav(); refreshFavOptions(); buildFavPanel(card);
  syncStar(card, name);
  if ($('favview').value !== '') render();   // live-updating a filtered view
});

function syncStar(card, name) {
  const btn = card.querySelector('.favbtn'), on = isFav(name);
  btn.classList.toggle('on', on);
  btn.textContent = on ? '\u2605' : '\u2606';
}

// --------------------------- toolbar folder mgmt ---------------------------
$('newfolder').addEventListener('click', () => {
  const f = (window.prompt('Folder name (e.g. Open City, EnCoach, Ideas):') || '')
              .trim().slice(0, 40);
  if (!f) return;
  if (!FAV[f]) { FAV[f] = []; saveFav(); refreshFavOptions(); }
  $('favview').value = 'fld:' + f;
  $('delfolder').style.display = '';
  render();
});

$('delfolder').addEventListener('click', () => {
  const fv = $('favview').value;
  if (!fv.startsWith('fld:')) return;
  const f = fv.slice(4);
  if (!window.confirm(`Delete folder "${f}" (${(FAV[f] || []).length} repos)? ` +
                      'The repos stay in the archive — only the folder is removed.')) return;
  delete FAV[f]; saveFav();
  $('favview').value = '__all__';
  refreshFavOptions(); render();
});

$('favview').addEventListener('input', () => {
  $('delfolder').style.display = $('favview').value.startsWith('fld:') ? '' : 'none';
});

for (const id of ['q', 'cat', 'sort', 'rising', 'venture', 'opps', 'favview'])
  $(id).addEventListener('input', render);
</script>
</body>
</html>
